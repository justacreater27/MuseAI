services:
  # =========================
  # MUSEAI BACKEND
  # =========================
  - type: web
    name: museai-backend
    runtime: python
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"

      - key: GEMINI_API_KEY
        sync: false

      - key: GROQ_API_KEY
        sync: false

      - key: FRONTEND_ORIGINS
        value: https://museai-frontend.onrender.com


  # =========================
  # MUSEAI TREND REFRESH
  # =========================
  - type: cron
    name: museai-trend-refresh
    runtime: python
    rootDir: .
    schedule: "0 */6 * * *"
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m backend.trend_engine.service

    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"

      - key: GEMINI_API_KEY
        sync: false

      - key: GROQ_API_KEY
        sync: false


  # =========================
  # MUSEAI FRONTEND
  # =========================
  - type: web
    name: museai-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist

    envVars:
      - key: VITE_API_URL
        value: https://museai-backend.onrender.com

      - key: VITE_FIREBASE_API_KEY
        sync: false

      - key: VITE_FIREBASE_AUTH_DOMAIN
        value: museai-ec4d3.firebaseapp.com

      - key: VITE_FIREBASE_PROJECT_ID
        value: museai-ec4d3

      - key: VITE_FIREBASE_STORAGE_BUCKET
        value: museai-ec4d3.firebasestorage.app

      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false

      - key: VITE_FIREBASE_APP_ID
        sync: false

      - key: VITE_FIREBASE_MEASUREMENT_ID
        sync: false

    routes:
      - type: rewrite
        source: /*
        destination: /index.html